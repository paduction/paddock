<!doctype html>
<!-- Stable entry point for the wall tablet: /local/paddock.html
     Home Assistant serves /local with a 31-day cache, so this page never changes and opens
     the app with a unique address on every load: the tablet always gets the latest deploy. -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paddock</title><style>html,body{margin:0;height:100%;background:#0b0a08}</style>
<script>location.replace('paddock/index.html?v=' + Date.now() + location.search.replace(/^\?/, '&') + location.hash);</script>
</head><body></body></html>
