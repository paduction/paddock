[package]
name = "paddock-desktop"
version = "0.1.0"
description = "Paddock for Mac, Windows and Linux: the wall-tablet interface in a desktop window"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "paddock_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
